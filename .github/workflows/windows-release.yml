name: Windows release

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect version bump
        id: version
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          $pattern = '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|rc)\.[1-9][0-9]?)?)"\s*$'
          $current = [regex]::Match((Get-Content Cargo.toml -Raw), $pattern)
          if (-not $current.Success) { throw 'Missing or unsupported Cargo package version.' }
          $version = $current.Groups[1].Value
          if ($env:EVENT_NAME -eq 'push' -and $env:BASE_SHA -match '^[0-9a-f]{40}$' -and $env:BASE_SHA -notmatch '^0+$') {
            $previous = git show "${env:BASE_SHA}:Cargo.toml"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the previous Cargo version.' }
            if ([regex]::Match(($previous -join "`n"), $pattern).Groups[1].Value -eq $version) {
              Write-Host "Cargo version is still $version."
              exit 0
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.version != ''
        with:
          dotnet-version: '10.0.x'
      - name: Check and build packages
        if: steps.version.outputs.version != ''
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-windows.ps1
      - name: Test installer and portable archive
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $prefix = "./target/dist/filehelm-${env:VERSION}-windows-x64"
          ./scripts/test-installer.ps1 -Msi "$prefix.msi" -ExpectedVersion $env:VERSION -PortableZip "$prefix-portable.zip"
          $root = (Get-Location).Path
          $fixtureDirectory = New-Item -ItemType Directory -Path target/update-fixture -Force
          $previous = Join-Path $fixtureDirectory.FullName previous.msi
          $env:DOTNET_ROLL_FORWARD = 'Major'
          & ./target/release-tools/5.0.2/wix.exe build installer/filehelm.wxs -arch x64 -pdbtype none -o $previous -d "Executable=$root/target/x86_64-pc-windows-msvc/release/filehelm.exe" -d "AppIcon=$root/assets/filehelm.ico" -d 'MsiVersion=0.0.1' -d 'ReleaseVersion=previous'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-installer.ps1 -Msi "$prefix.msi" -ExpectedVersion $env:VERSION -PreviousMsi $previous -AppUpdate
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.version != ''
        with:
          name: windows-x64
          path: |
            target/dist/*.msi
            target/dist/*.zip
            target/dist/SHA256SUMS.txt
            target/dist/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-logs
          path: target/dist/installer-logs/
          if-no-files-found: ignore

  publish:
    needs: package
    if: needs.package.outputs.version != ''
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already has a release."
            exit 0
          }
          $prefix = "dist/filehelm-${env:VERSION}-windows-x64"
          $arguments = @('release', 'create', $tag, "$prefix.msi", "$prefix-portable.zip", 'dist/SHA256SUMS.txt',
            '--target', $env:GITHUB_SHA, '--title', "Filehelm $env:VERSION", '--notes-file', 'dist/release-notes.md')
          if ($env:VERSION.Contains('-')) { $arguments += @('--prerelease', '--latest=false') }
          gh @arguments
          exit $LASTEXITCODE
